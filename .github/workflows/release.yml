name: Release

# v* 태그를 푸시하면 테스트 -> 빌드 -> TestPyPI -> PyPI 순으로 돈다.
# 프리릴리스 버전(0.1.0a1처럼 a, b, rc, dev가 붙은 것)은 TestPyPI에만 올리고 PyPI는 건너뛴다.
# 올리기는 Trusted Publishing(OIDC)으로 한다. API 토큰을 저장소에 두지 않는다.
# 환경 이름 testpypi, pypi는 두 저장소에 이 이름으로 등록돼 있다. 바꾸면 배포가 막힌다.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: 태그와 버전이 같은지 확인
        run: |
          version="$(uv version --short)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::태그와 pyproject.toml의 버전이 다릅니다. 태그: ${GITHUB_REF_NAME}, 버전: ${version}"
            exit 1
          fi
      - name: 프리릴리스인지 확인
        id: kind
        # PEP 440의 프리릴리스(a, b, rc)와 개발판(dev)이면 PyPI에 올리지 않는다.
        # packaging이 판단하고, 버전을 읽지 못하면 이 단계가 실패해 아무 데도 올리지 않는다
        run: |
          prerelease="$(uv run --no-project --with packaging python -c \
            'import sys; from packaging.version import Version; print(str(Version(sys.argv[1]).is_prerelease).lower())' \
            "$(uv version --short)")"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
      - name: 빌드
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/deeptwin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, publish-testpypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deeptwin
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
