name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 파일 잠금, 경로, 줄바꿈이 운영체제마다 다르다
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv는 움직이는 major 태그(v10)를 두지 않는다. 최신 v10.4.0을 커밋으로 고정한다
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: 의존성 설치
        run: uv sync --locked
      - name: 린트
        run: uv run ruff check
      - name: 서식
        run: uv run ruff format --check
      - name: 타입 검사
        run: uv run mypy
      - name: 의존 규칙
        run: uv run lint-imports
        env:
          # 계약 이름이 한글이다. Windows 콘솔의 기본 인코딩(cp1252)으로는 출력하지 못한다
          PYTHONIOENCODING: utf-8
      - name: 테스트
        run: uv run pytest
