<svg xmlns="http://www.w3.org/2000/svg" width="612" height="822" viewBox="0 0 612 822" role="img"><title>Derivative preview of a synthetic PDF page</title><rect width="612" height="822" fill="#edf4f3"/><text x="20" y="19" font-family="Arial,sans-serif" font-size="10" fill="#486064">DERIVATIVE PREVIEW - OPEN THE PDF FOR THE ORIGINAL FORMAT</text><g transform="translate(0 30)"><rect width="612" height="792" fill="white" stroke="#bccdca"/><text x="54" y="56" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">SYNTHETIC UI FIXTURE - NOT AN ACTUAL LIBRARY PLAN</text><text x="54" y="70" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">Thursday room-use briefing - draft 2</text><text x="54" y="84" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve"></text><text x="54" y="98" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">SUMMARY</text><text x="54" y="112" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">Thursday offers the quiet room, workshop and hall together from 14:00 to</text><text x="54" y="126" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">16:00, providing a combined capacity of 68. The workshop setup finishes</text><text x="54" y="140" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">before that window begins. The hall closes at 16:00, so later alternatives</text><text x="54" y="154" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">must not silently extend its session. Publication remains subject to</text><text x="54" y="168" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">coordinator release.</text><text x="54" y="182" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve"></text><text x="54" y="196" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">ROOM SCHEDULE</text><text x="54" y="210" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">Quiet: 14:00-16:00, 8 places. Workshop: 14:00-16:00, 20 places. Hall:</text><text x="54" y="224" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">14:00-16:00, 40 places.</text><text x="54" y="238" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve"></text><text x="54" y="252" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">BOOKING AND PUBLICATION NOTES</text><text x="54" y="266" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">Retain the dated occupancy source and room-use policy with this brief.</text><text x="54" y="280" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">Capacity figures describe people, not bookings. A release decision must</text><text x="54" y="294" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">inspect the complete schedule and unresolved constraints; viewing this</text><text x="54" y="308" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">fixture cannot publish, reserve, or approve anything.</text><text x="54" y="322" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve"></text><text x="54" y="336" font-family="Courier,monospace" font-size="11" fill="#162b2d" xml:space="preserve">No reservation, public post, approval or model execution has occurred.</text></g></svg>