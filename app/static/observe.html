<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DeepTwin — 실행 관제</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./observe.mjs"></script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <span class="wordmark" aria-label="DeepTwin 실행 관제">Deep<span>Twin</span></span>
    </header>
    <main>
      <aside class="development-preview" aria-label="개발 미리보기 상태">
        <strong>개발 미리보기</strong>
        <p>이 화면은 이미 기록된 실행을 관제합니다. 실행을 새로 시작하는 화면은 아직 구현 중이며, 맡길 일의 설명은 <a href="./work.html">업무 화면</a>에서 저장합니다. 소유자 설정·로그인은 시작 화면에서 합니다.</p>
      </aside>
      <div class="space-label"><span class="space-mark" aria-hidden="true"></span> 실행 관제</div>
      <h1>기록된 실행을 살펴봅니다</h1>
      <p id="session-status" role="status" aria-live="polite" data-state="">브라우저 세션을 확인하는 중…</p>
      <section id="run-source" class="run-source" aria-label="관제할 실행 선택"></section>
      <section id="run-panel" class="run-panel" aria-label="선택한 실행의 상태" data-phase="" data-run-id=""></section>
      <section id="run-artifacts" class="run-artifacts" aria-label="선택한 실행의 산출물"></section>
      <footer>
        <p>상태는 서버가 기록한 사실에서만 옵니다. 지난 시도는 별도 행으로 남고, 최신 산출물은 과거 시도에 붙지 않습니다.</p>
      </footer>
    </main>
  </div>
</body>
</html>
