<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DeepTwin — 기록</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./records-page.mjs"></script>
</head>
<body class="shell-page page-records">
  <div id="app" class="app-shell" data-page="records">
    <main id="main">
      <header class="page-header">
        <h1>기록</h1>
        <p class="page-purpose">이 인스턴스에 남은 사건을 시간순으로 보고 업무·실행·종류·기간으로 거릅니다. 모든 실행의 산출물도 한곳에서 찾습니다. 내보내기는 업무마다 업무 화면에서 합니다.</p>
      </header>
      <p id="session-status" role="status" aria-live="polite" data-state="">브라우저 세션을 확인하는 중…</p>
      <div class="records-layout">
        <section id="records-logs" class="records-section card" aria-labelledby="records-logs-title">
          <h2 id="records-logs-title">사건 기록</h2>
          <div id="records-filters" class="records-filters-mount"></div>
          <div id="records-log" class="records-log"></div>
        </section>
        <section id="records-export" class="records-section card" aria-label="내보내기"></section>
      </div>
      <section id="artifacts" class="artifact-index records-section card" aria-label="모든 실행의 산출물"></section>
    </main>
  </div>
</body>
</html>
