<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DeepTwin — 기록</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./records-page.mjs"></script>
</head>
<body class="shell-page page-records">
  <div id="app" class="app-shell" data-page="records">
    <main id="main">
      <header class="page-header">
        <h1>기록</h1>
        <p class="page-purpose">이 인스턴스에 남은 사건을 시간순으로 봅니다. 내보내기는 업무마다 업무 화면에서 합니다.</p>
      </header>
      <p id="session-status" role="status" aria-live="polite" data-state="">브라우저 세션을 확인하는 중…</p>
      <div class="records-layout">
        <section id="records-logs" class="records-section card" aria-label="기록"></section>
        <section id="records-export" class="records-section card" aria-label="내보내기"></section>
      </div>
    </main>
  </div>
</body>
</html>
