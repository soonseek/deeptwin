<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DeepTwin — 업무</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./work.mjs"></script>
</head>
<body class="owner-work-page">
  <div id="app">
    <header class="app-header">
      <span class="wordmark" aria-label="DeepTwin">Deep<span>Twin</span></span>
    </header>
    <main>
      <aside class="development-preview" aria-label="개발 미리보기 상태">
        <strong>개발 미리보기</strong>
        <p>설명·자료 원본을 저장하고, Claude 연결로 작업 모델을 만들고 확인합니다. 원본 내용 읽기·마이크·설계·실행 연결은 아직 개발 중입니다.</p>
      </aside>
      <div class="space-label"><span class="space-mark" aria-hidden="true"></span> 업무</div>
      <h1>설명이나 자료로 시작하세요</h1>
      <p id="session-status" role="status" aria-live="polite" data-state="">브라우저 세션을 확인하는 중…</p>
      <section id="intake-notice" class="introduction" aria-label="보관과 전송 안내"></section>
      <form id="work-form" class="work-surface" aria-label="업무 설명" method="post" hidden></form>
      <p id="save-status" role="status" aria-live="polite" data-state=""></p>
      <section id="materials" class="materials" aria-label="자료"></section>
      <section id="work-model" class="work-model" aria-label="작업 모델"></section>
      <section id="work-records" class="work-records" aria-label="기록 내보내기"></section>
      <section id="work-deletion" class="work-deletion" aria-label="원본 삭제"></section>
      <nav id="observe-link" aria-label="다른 화면"></nav>
      <footer>
        <p>설명과 자료 원본은 이 인스턴스에 수정본 단위로 남습니다. 미저장 설명은 이 브라우저에 임시 보관되며, 선택한 파일은 이 화면을 닫으면 다시 선택해야 합니다.</p>
      </footer>
    </main>
  </div>
</body>
</html>
