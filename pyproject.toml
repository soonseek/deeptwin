[project]
name = "deeptwin"
version = "0.1.0"
description = "Trace-grounded framework for diagnosing, validating, and governing expert-judgment knowledge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "cyclonedx-bom>=7.3.1",
    "detect-secrets>=1.5.0",
    "hypothesis>=6.167.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "reuse>=6.2.0",
    "ruff>=0.16.6",
    "types-pyyaml>=6.0.12.20260815",
]
