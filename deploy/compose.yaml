    "image_requirement": "Each image variable must resolve to an exact OCI reference containing @sha256:.",
    "required_control_listener_target": "http://control:8080",
    "profile_selection": {
      "required_exactly_one": ["local", "portable"],
      "compose_limitation": "Compose profiles do not prevent selecting both; deployment validation must reject zero or multiple edge profiles."
    },
    "open_gates": [
      "T025 must implement a control entrypoint that owns /var/lib/deeptwin and listens on the internal target http://control:8080; current app.server loopback behavior does not satisfy this.",
      "T025/T081 must validate exactly one edge profile and bind the exact OriginProfile across edge, control, session, CSRF, and receipts.",
      "Compose may interpolate global portable config/TLS resource variables before applying the local profile; T081 must split validated profile descriptors/overrides or qualify a full-resource model before this single-file skeleton is runnable.",
      "T081 must verify pinned external portable proxy configuration and operator TLS certificate/key content digests before startup.",
      "T018 must qualify state-root and per-boot IPC-secret initialization, rotation, crash behavior, Linux ownership, and SO_PEERCRED handshakes.",
      "T018/T081 must qualify each bounded tmpfs path against the final read-only service image and deny fallback writes to IPC volumes.",
      "T025/T081 must qualify provider credential, session-root, Codex device-auth ownership, and deployment-receipt secret lifecycles; this skeleton declares only IPC boot secrets, Codex auth state, portable edge TLS, and backup public-recipient input.",
      "T070/T081 must implement and qualify backup archive streaming, public-recipient validation, output atomicity, private restore identity handling, and restore verification.",
      "T025 must keep browser owner setup as the user entrypoint; Docker/Compose are external deployment operator mechanisms, not a product launcher or end-user CLI.",
      "T079/T081/T083 must supply exact final images and complete integrated security, dual-platform, and fresh-host runtime evidence."
    ]
  },
